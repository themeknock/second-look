<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="440" fill="#fbfbf9"/>

  <text x="40" y="38" font-size="13" font-weight="600" letter-spacing="1.6" fill="#6b7280">WHAT THE AGENT SAID</text>
  <text x="40" y="272" font-size="13" font-weight="600" letter-spacing="1.6" fill="#6b7280">WHAT ACTUALLY HAPPENED</text>

  <!-- top lane: transcript -> LLM extractor -> claims -->
  <rect x="40" y="56" width="150" height="70" rx="9" fill="#fff" stroke="#e6e6e3"/>
  <text x="115" y="86" font-size="15" font-weight="600" text-anchor="middle" fill="#16181d">transcript</text>
  <text x="115" y="106" font-size="12.5" text-anchor="middle" fill="#6b7280">assistant turns only</text>

  <path d="M196 91 L242 91" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="248" y="50" width="186" height="82" rx="9" fill="#f4f0fb" stroke="#6941c6" stroke-width="1.4"/>
  <text x="341" y="78" font-size="15" font-weight="600" text-anchor="middle" fill="#4a2f9a">LLM: extract</text>
  <text x="341" y="97" font-size="12.5" text-anchor="middle" fill="#6941c6">“what did it claim?”</text>
  <text x="341" y="115" font-size="12.5" text-anchor="middle" fill="#6941c6">never “was it right?”</text>

  <path d="M440 91 L486 91" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="492" y="56" width="150" height="70" rx="9" fill="#fff" stroke="#e6e6e3"/>
  <text x="567" y="86" font-size="15" font-weight="600" text-anchor="middle" fill="#16181d">claims</text>
  <text x="567" y="106" font-size="12.5" text-anchor="middle" fill="#6b7280">typed, normalised</text>

  <!-- the barrier -->
  <line x1="40" y1="182" x2="860" y2="182" stroke="#d0d0cb" stroke-width="1.3" stroke-dasharray="6 5"/>
  <rect x="300" y="168" width="300" height="28" rx="14" fill="#fbfbf9"/>
  <text x="450" y="187" font-size="12.5" font-weight="600" text-anchor="middle" fill="#6b7280">the extractor never sees anything below this line</text>

  <!-- bottom lane: evidence -->
  <rect x="40" y="290" width="150" height="70" rx="9" fill="#fff" stroke="#e6e6e3"/>
  <text x="115" y="320" font-size="15" font-weight="600" text-anchor="middle" fill="#16181d">event log</text>
  <text x="115" y="340" font-size="12.5" text-anchor="middle" fill="#6b7280">every tool call</text>

  <rect x="206" y="290" width="150" height="70" rx="9" fill="#fff" stroke="#e6e6e3"/>
  <text x="281" y="320" font-size="15" font-weight="600" text-anchor="middle" fill="#16181d">catalogue</text>
  <text x="281" y="340" font-size="12.5" text-anchor="middle" fill="#6b7280">prices, hours, area</text>

  <path d="M190 325 L206 325" stroke="#c9c9c4" stroke-width="1.6"/>
  <path d="M362 325 L410 325" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- the checker: where the two lanes meet -->
  <rect x="416" y="278" width="196" height="94" rx="9" fill="#f0f6f2" stroke="#067647" stroke-width="1.4"/>
  <text x="514" y="306" font-size="15" font-weight="600" text-anchor="middle" fill="#04512f">code: check</text>
  <text x="514" y="325" font-size="12.5" text-anchor="middle" fill="#067647">one checker per claim kind</text>
  <text x="514" y="343" font-size="12.5" text-anchor="middle" fill="#067647">exact match, with the</text>
  <text x="514" y="359" font-size="12.5" text-anchor="middle" fill="#067647">event index it used</text>

  <path d="M567 132 L567 150 Q567 160 557 160 L524 160 Q514 160 514 170 L514 278" fill="none" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- verdicts out -->
  <path d="M618 325 L664 325" stroke="#c9c9c4" stroke-width="1.6" marker-end="url(#a)"/>

  <g>
    <rect x="670" y="256" width="190" height="34" rx="7" fill="#fff" stroke="#067647"/>
    <circle cx="690" cy="273" r="5" fill="#067647"/>
    <text x="704" y="278" font-size="13" fill="#16181d">SUPPORTED, with the event</text>
  </g>
  <g>
    <rect x="670" y="298" width="190" height="34" rx="7" fill="#fff" stroke="#b42318"/>
    <circle cx="690" cy="315" r="5" fill="#b42318"/>
    <text x="704" y="320" font-size="13" fill="#16181d">CONTRADICTED, run fails</text>
  </g>
  <g>
    <rect x="670" y="340" width="190" height="34" rx="7" fill="#fff" stroke="#b54708"/>
    <circle cx="690" cy="357" r="5" fill="#b54708"/>
    <text x="704" y="362" font-size="13" fill="#16181d">UNVERIFIABLE, not a lie</text>
  </g>

  <!-- triage loop -->
  <path d="M765 374 L765 396 L500 396 L500 384" fill="none" stroke="#b54708" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="500" y="416" font-size="12.5" text-anchor="middle" fill="#b54708">LLM: triage, on unverifiable claims only</text>
  <text x="500" y="432" font-size="12.5" text-anchor="middle" fill="#b54708">how much does not knowing cost? risk, never truth. High risk goes to a human.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c4"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b54708"/>
    </marker>
  </defs>
</svg>
